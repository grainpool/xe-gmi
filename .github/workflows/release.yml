name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross: false
          - target: aarch64-unknown-linux-musl
            cross: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: ${{ !matrix.cross }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: ${{ matrix.cross }}
        run: cargo install cross --locked
      - name: dependency set check
        run: |
          out="$(cargo tree -e normal --depth 1 --prefix none | grep -v '^xe-gmi' | awk '{print $1}' | sort -u | paste -sd' ')"
          if [ "$out" != "clap clap_complete clap_mangen rustix" ]; then
            echo "unexpected normal dependency set: $out"; exit 1
          fi
      - name: build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then cross build --release --locked --target ${{ matrix.target }}
          else cargo build --release --locked --target ${{ matrix.target }}; fi
      - name: verify static (native only)
        if: ${{ !matrix.cross }}
        run: scripts/check-static.sh target/${{ matrix.target }}/release/xe-gmi
      - name: package
        run: |
          V="${GITHUB_REF_NAME#v}"; T="${{ matrix.target }}"; D="xe-gmi-$V-$T"
          mkdir -p "$D/completions"
          cp target/$T/release/xe-gmi README.md LICENSE-MIT LICENSE-APACHE "$D/"
          # man page and completions are generated by the host-native binary
          cargo build --release --locked
          target/release/xe-gmi man --out "$D"
          target/release/xe-gmi completions bash > "$D/completions/xe-gmi.bash"
          target/release/xe-gmi completions zsh  > "$D/completions/_xe-gmi"
          target/release/xe-gmi completions fish > "$D/completions/xe-gmi.fish"
          tar czf "$D.tar.gz" "$D"
          sha256sum "$D.tar.gz" > "$D.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.target }}", path: "xe-gmi-*.tar.gz*" }
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && cat *.sha256 > SHA256SUMS && ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - run: cargo publish --dry-run --locked
