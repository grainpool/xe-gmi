[package]
name = "xe-gmi"
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
description = "GPU management CLI for Intel GPUs driven by the xe kernel driver: query, monitor, control and persist power/clock settings"
license = "MIT OR Apache-2.0"
authors = ["Grainpool Holdings LLC <grainpool@users.noreply.github.com>"]
repository = "https://github.com/grainpool/xe-gmi"
homepage = "https://grainpoolholdings.com"
documentation = "https://github.com/grainpool/xe-gmi#readme"
readme = "README.md"
keywords = ["intel", "gpu", "xe", "sysfs", "monitoring"]
categories = ["command-line-utilities", "hardware-support"]
# Keep the published crate small; tests need fixtures/ so run them from the git checkout.
exclude = ["fixtures/", "verify/", "scripts/", ".github/", "docs/", "man/"]

[[bin]]
name = "xe-gmi"
path = "src/main.rs"

[dependencies]
# The complete runtime dependency surface, four crates and no more; std + /sys + /proc + /etc reads
# cover everything else. rustix exists solely for src/kabi/, the kernel-interface module.
clap = { version = "4.5", features = ["derive", "cargo", "wrap_help"] }
clap_complete = "4.5"
clap_mangen = "0.2"
rustix = { version = "1", default-features = false, features = ["std", "fs", "net"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
panic = "unwind"
